# CARS site configuration — the dissertation testbed instantiation.
# This is an EXAMPLE. To deploy CARS on your own network, copy this file and
# replace the assets, bindings, conduits and rulebook with your own.
# Every value here is taken verbatim from the validated engine (06_Build/cars_engine.py),
# so this file reproduces the testbed policy exactly.

criticality:
  weights: { CRITICAL: 3, HIGH: 2, MEDIUM: 1, LOW: 0 }
  timeout_base_s: 30        # BLOCK_TIMEOUT; installed hold = base + step * weight
  timeout_step_s: 15        # gives 75 / 60 / 45 / 30 s for CRITICAL / HIGH / MEDIUM / LOW

response:
  ladder: [ALLOW, MONITOR, THROTTLE, DEFLECT, ISOLATE, BLOCK, REFUSE]
  throttle_rate: 20         # THROTTLE_RATE (pps meter)
  throttle_burst: 10        # THROTTLE_BURST
  reactive_cookie: 0x00ca   # stamped on every reactive rule
  proactive_cookie: 0x00a2  # stamped on the fixed proactive policy
  honeypot_ip: 192.168.3.99 # DEFLECT redirect target
  shared_roles: [gateway]   # NAT/collapse points: conduit BLOCK, never whole-source ISOLATE
  flood_exempt: [192.168.2.55]   # legitimate high-rate process-I/O hosts (Factory IO HIL)

# Protected and known assets. role is one of: plc, hmi, historian, scada, ews,
# remediation, gateway, supervisory. Anything not listed resolves to 'unknown'
# (strict default-deny; dangerous operations FORBIDDEN).
assets:
  - { name: PLC1,        ip: 192.168.2.10, role: plc,         cell: 1, tier: CRITICAL }
  - { name: HMI1,        ip: 192.168.2.9,  role: hmi,         cell: 1, tier: HIGH }
  - { name: PLC2,        ip: 192.168.3.10, role: plc,         cell: 2, tier: HIGH }     # via Cell-2 NAT
  - { name: HMI2,        ip: 192.168.3.9,  role: hmi,         cell: 2, tier: MEDIUM }   # via Cell-2 NAT
  - { name: Historian,   ip: 192.168.2.30, role: historian,  tier: MEDIUM }
  - { name: ModbusUnit,  ip: 192.168.2.20, role: plc,         tier: LOW }
  - { name: SCADA,       ip: 192.168.2.31, role: scada }
  - { name: EWS,         ip: 192.168.2.55, role: ews }
  - { name: Remediation, ip: 192.168.2.45, role: remediation }
  - { name: Gateway,     ip: 192.168.2.1,  role: gateway }
  - { name: HistCell2,   ip: 192.168.3.66, role: historian }
  - { name: Attacker,    ip: 192.168.2.66, role: unknown }

# GUARD anti-spoof bindings: (dpid, ofport, mac, ip). A protected identity is
# accepted only from its bound port and MAC; a forgery from any other port is dropped.
bindings:
  - { dpid: 1, ofport: 1,  mac: "e0:dc:a0:63:98:09", ip: 192.168.2.10 }
  - { dpid: 1, ofport: 2,  mac: "e0:dc:a0:62:b7:4c", ip: 192.168.2.9 }
  - { dpid: 2, ofport: 1,  mac: "e0:dc:a0:46:ff:ce", ip: 192.168.2.10 }
  - { dpid: 2, ofport: 2,  mac: "e0:dc:a0:5c:60:44", ip: 192.168.2.9 }
  - { dpid: 3, ofport: 3,  mac: "de:5a:28:ae:96:03", ip: 192.168.2.30 }
  - { dpid: 3, ofport: 10, mac: "02:00:00:00:02:31", ip: 192.168.2.31 }  # scada
  - { dpid: 3, ofport: 14, mac: "92:b7:80:63:54:56", ip: 192.168.2.45 }  # remediation
  - { dpid: 3, ofport: 7,  mac: "02:00:00:00:02:20", ip: 192.168.2.20 }  # modbus server
  - { dpid: 3, ofport: 12, mac: "b4:e9:b8:a4:ce:46", ip: 192.168.2.55 }  # EWS / Factory IO

# Inter-switch uplinks (dpid -> [dpid]).
uplinks: { 1: [3], 3: [1], 2: [] }

# Proactive allowlist of conduits: (src_ip, dst_ip, proto, dport). proto 6 = TCP.
# Every other new connection to a protected asset is default-denied.
conduits:
  - { src: 192.168.2.31, dst: 192.168.2.20, proto: 6, dport: 502 }  # operator -> Modbus PLC
  - { src: 192.168.2.9,  dst: 192.168.2.10, proto: 6, dport: 102 }  # HMI1 -> PLC1 S7
  - { src: 192.168.2.31, dst: 192.168.2.10, proto: 6, dport: 102 }  # SCADA/eng -> PLC1 S7
  - { src: 192.168.3.66, dst: 192.168.3.10, proto: 6, dport: 102 }  # Cell-2 eng -> PLC2 S7
  - { src: 192.168.2.55, dst: 192.168.2.10, proto: 6, dport: 102 }  # EWS -> PLC1 S7
  - { src: 192.168.2.55, dst: 192.168.2.9,  proto: 6, dport: 102 }  # EWS -> HMI1 (KTP700)
  - { src: 192.168.2.45, dst: 192.168.2.10, proto: 6, dport: 102 }  # remediation -> PLC1 S7
  - { src: 192.168.2.30, dst: 192.168.2.10, proto: 6, dport: 102 }  # Historian -> PLC1 S7 READ
  - { src: 192.168.2.30, dst: 192.168.2.20, proto: 6, dport: 502 }  # Historian -> Modbus READ

# Default-deny anchors: (dpid or null-for-all, protected_ip).
default_deny:
  - { dpid: null, ip: 192.168.2.20 }
  - { dpid: 1,    ip: 192.168.2.10 }
  - { dpid: 1,    ip: 192.168.2.9 }
  - { dpid: 2,    ip: 192.168.2.9 }

# Rulebook: first match wins. (src_role, dst_role, operation, tier).
# operation in: READ, WRITE, CONTROL, DIAG, PROGRAM, ILLEGAL, any.
# tier in: CRITICAL (safety loop, never enforced), OPERATIONAL, SENSITIVE, FORBIDDEN.
# A SENSITIVE operation on a CRITICAL asset is elevated to FORBIDDEN outside a maintenance window.
rulebook:
  - [hmi,         plc, any,     CRITICAL]
  - [plc,         hmi, any,     CRITICAL]
  - [remediation, plc, CONTROL, OPERATIONAL]
  - [remediation, plc, any,     OPERATIONAL]
  - [ews,         plc, READ,    OPERATIONAL]
  - [ews,         plc, WRITE,   OPERATIONAL]
  - [ews,         plc, CONTROL, OPERATIONAL]
  - [any,         plc, CONTROL, FORBIDDEN]
  - [any,         hmi, CONTROL, FORBIDDEN]
  - [any,         plc, DIAG,    FORBIDDEN]
  - [any,         hmi, DIAG,    FORBIDDEN]
  - [any,         plc, PROGRAM, FORBIDDEN]
  - [any,         hmi, PROGRAM, FORBIDDEN]
  - [any,         plc, ILLEGAL, FORBIDDEN]
  - [any,         hmi, ILLEGAL, FORBIDDEN]
  - [ews,         plc, any,     OPERATIONAL]
  - [ews,         hmi, any,     SENSITIVE]
  - [supervisory, plc, WRITE,   SENSITIVE]
  - [historian,   plc, WRITE,   SENSITIVE]
  - [scada,       plc, WRITE,   SENSITIVE]
  - [supervisory, hmi, WRITE,   SENSITIVE]
  - [historian,   hmi, WRITE,   SENSITIVE]
  - [scada,       hmi, WRITE,   SENSITIVE]
  - [supervisory, plc, any,     OPERATIONAL]
  - [historian,   plc, any,     OPERATIONAL]
  - [scada,       plc, any,     OPERATIONAL]
  - [supervisory, hmi, any,     OPERATIONAL]
  - [historian,   hmi, any,     OPERATIONAL]
  - [scada,       hmi, any,     OPERATIONAL]
  - [any,         plc, any,     FORBIDDEN]
  - [any,         hmi, any,     FORBIDDEN]
  - [any,         any, any,     FORBIDDEN]

controller:
  of_version: "1.3"
  listen: "0.0.0.0:6653"
  api: "10.10.10.1:8080"       # /cars/respond feed + authenticated control endpoints

detection:
  sensor: snort
  alert_file: /var/log/snort/alert
  dedup_cooldown_s: 3
