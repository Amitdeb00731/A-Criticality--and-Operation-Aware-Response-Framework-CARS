# CARS site config for the EMULATION (Mininet). Identical to site.testbed.yaml
# except GUARD bindings are empty: the anti-spoof layer pins identities to physical
# switch ports/MACs, which Mininet assigns differently. POLICY (allowlist + stateful
# default-deny + reactive) still enforces the actual defence.
criticality:
  weights:
    CRITICAL: 3
    HIGH: 2
    MEDIUM: 1
    LOW: 0
  timeout_base_s: 30
  timeout_step_s: 15
response:
  ladder:
  - ALLOW
  - MONITOR
  - THROTTLE
  - DEFLECT
  - ISOLATE
  - BLOCK
  - REFUSE
  throttle_rate: 20
  throttle_burst: 10
  reactive_cookie: 202
  proactive_cookie: 162
  honeypot_ip: 192.168.3.99
  shared_roles:
  - gateway
  flood_exempt:
  - 192.168.2.55
assets:
- name: PLC1
  ip: 192.168.2.10
  role: plc
  cell: 1
  tier: CRITICAL
- name: HMI1
  ip: 192.168.2.9
  role: hmi
  cell: 1
  tier: HIGH
- name: PLC2
