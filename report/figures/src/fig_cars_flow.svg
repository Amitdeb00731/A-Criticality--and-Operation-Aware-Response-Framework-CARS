<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="Helvetica">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3a4a5c"/></marker></defs>
<rect width="1180" height="470" fill="white"/>
<text x="60" y="40" text-anchor="start" font-family="Helvetica" font-size="18" font-weight="700" fill="#1f2d3d">A packet's path through the CARS fabric</text><text x="40" y="92" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="400" fill="#5b6b7d">packet</text><line x1="40" y1="100" x2="90" y2="100" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="90" y="72" width="250" height="110" rx="9" fill="#eaf1f9" stroke="#2f6db0" stroke-width="2"/><text x="215.0" y="95" text-anchor="middle" font-family="Helvetica" font-size="15" font-weight="700" fill="#1f2d3d">Table 0: GUARD</text><text x="215.0" y="116" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">identity binding (anti-spoof):</text><text x="215.0" y="132" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">a bound source goes to Table 1,</text><text x="215.0" y="148" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">a spoofed one is dropped</text><line x1="340" y1="127" x2="392" y2="127" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="392" y="72" width="300" height="110" rx="9" fill="#e8f5ee" stroke="#3a8f5b" stroke-width="2"/><text x="542.0" y="95" text-anchor="middle" font-family="Helvetica" font-size="15" font-weight="700" fill="#1f2d3d">Table 1: POLICY (stateful)</text><text x="542.0" y="116" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">established passes; an allowlisted</text><text x="542.0" y="132" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">conduit commits; default-deny;</text><text x="542.0" y="148" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">reactive rules sit on top</text><line x1="692" y1="127" x2="744" y2="127" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="744" y="72" width="250" height="110" rx="9" fill="#eef0f2" stroke="#6b7480" stroke-width="2"/><text x="869.0" y="95" text-anchor="middle" font-family="Helvetica" font-size="15" font-weight="700" fill="#1f2d3d">Table 2: SWITCH</text><text x="869.0" y="116" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">learning forward to the</text><text x="869.0" y="132" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">destination asset</text><line x1="994" y1="127" x2="1044" y2="127" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><text x="1052" y="131" text-anchor="start" font-family="Helvetica" font-size="12" font-weight="400" fill="#5b6b7d">asset</text><text x="60" y="222" text-anchor="start" font-family="Helvetica" font-size="15" font-weight="700" fill="#1f2d3d">The reactive decision that installs a rule into Table 1</text><rect x="60" y="250" width="300" height="150" rx="9" fill="#fbf3ea" stroke="#8a5a2b" stroke-width="2"/><text x="210.0" y="273" text-anchor="middle" font-family="Helvetica" font-size="15" font-weight="700" fill="#1f2d3d">Snort DPI recovers the operation</text><rect x="76" y="286" width="88" height="26" rx="13" fill="#eef2f6" stroke="#c2ccd6" stroke-width="1.4"/><text x="120.0" y="303" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#1f2d3d">READ</text><rect x="172" y="286" width="88" height="26" rx="13" fill="#eef2f6" stroke="#c2ccd6" stroke-width="1.4"/><text x="216.0" y="303" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#1f2d3d">WRITE</text><rect x="268" y="286" width="88" height="26" rx="13" fill="#eef2f6" stroke="#c2ccd6" stroke-width="1.4"/><text x="312.0" y="303" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#1f2d3d">CONTROL</text><rect x="76" y="320" width="88" height="26" rx="13" fill="#eef2f6" stroke="#c2ccd6" stroke-width="1.4"/><text x="120.0" y="337" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#1f2d3d">DIAG</text><rect x="172" y="320" width="88" height="26" rx="13" fill="#eef2f6" stroke="#c2ccd6" stroke-width="1.4"/><text x="216.0" y="337" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#1f2d3d">PROGRAM</text><rect x="268" y="320" width="88" height="26" rx="13" fill="#eef2f6" stroke="#c2ccd6" stroke-width="1.4"/><text x="312.0" y="337" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#1f2d3d">ILLEGAL</text><text x="210" y="390" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="600" fill="#5b6b7d">+ source role  + asset criticality</text><line x1="360" y1="325" x2="410" y2="325" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="410" y="258" width="250" height="134" rx="9" fill="#eef2f6" stroke="#5b6b7d" stroke-width="2"/><text x="535.0" y="281" text-anchor="middle" font-family="Helvetica" font-size="15" font-weight="700" fill="#1f2d3d">Rulebook  →  tier</text><text x="535" y="300" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="600" fill="#3a8f5b">•  OPERATIONAL</text><text x="535" y="322" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="600" fill="#c08a2b">•  SENSITIVE</text><text x="535" y="344" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="600" fill="#b23b3b">•  FORBIDDEN</text><text x="535" y="366" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="600" fill="#4a5568">•  CRITICAL = safety loop</text><line x1="660" y1="325" x2="710" y2="325" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="710" y="258" width="210" height="134" rx="9" fill="#fdeef0" stroke="#b23b3b" stroke-width="2"/><text x="815.0" y="281" text-anchor="middle" font-family="Helvetica" font-size="15" font-weight="700" fill="#1f2d3d">Criticality elevation</text><text x="815.0" y="302" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">SENSITIVE on a CRITICAL</text><text x="815.0" y="318" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">asset → FORBIDDEN</text><text x="815.0" y="334" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#1f2d3d">(outside a maintenance window)</text><line x1="920" y1="325" x2="970" y2="325" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="970" y="240" width="170" height="180" rx="9" fill="#eef2f6" stroke="#5b6b7d" stroke-width="2"/><text x="1055.0" y="263" text-anchor="middle" font-family="Helvetica" font-size="15" font-weight="700" fill="#1f2d3d">Response ladder</text><text x="1055" y="276" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="400" fill="#1f2d3d">ALLOW</text><text x="1055" y="295" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="400" fill="#1f2d3d">MONITOR</text><text x="1055" y="314" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="400" fill="#1f2d3d">THROTTLE</text><text x="1055" y="333" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="400" fill="#1f2d3d">DEFLECT</text><text x="1055" y="352" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="700" fill="#1f2d3d">ISOLATE</text><text x="1055" y="371" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="700" fill="#1f2d3d">BLOCK</text><text x="1055" y="390" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="700" fill="#1f2d3d">REFUSE</text><path d="M 1055 240 C 1055 205, 660 202, 545 184" fill="none" stroke="#b23b3b" stroke-width="2.6" marker-end="url(#ah)"/><rect x="608" y="191" width="250" height="21" rx="4" fill="white" opacity="0.92"/><text x="733" y="206" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="700" fill="#b23b3b">install the response into Table 1</text><text x="1055" y="442" text-anchor="middle" font-family="Helvetica" font-size="10.5" font-weight="600" fill="#b23b3b">reactive rule, cookie 0x00ca</text><text x="1055" y="456" text-anchor="middle" font-family="Helvetica" font-size="10.5" font-weight="400" fill="#b23b3b">criticality-scaled self-heal</text></svg>