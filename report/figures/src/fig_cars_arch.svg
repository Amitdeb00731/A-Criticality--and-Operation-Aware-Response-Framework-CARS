<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="Helvetica">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3a4a5c"/></marker></defs>
<rect width="1180" height="560" fill="white"/><text x="60" y="40" text-anchor="start" font-family="Helvetica" font-size="16" font-weight="700" fill="#1f2d3d">The CARS framework: a criticality- and operation-aware SDN intrusion-response architecture</text><rect x="50" y="120" width="220" height="215" rx="9" fill="#fbf1dc" stroke="#c9922b" stroke-width="2"/><text x="160.0" y="142" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#1f2d3d">Site configuration</text><text x="160" y="165" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#1f2d3d">- asset registry + criticality tiers</text><text x="160" y="191" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#1f2d3d">- role / operation taxonomy</text><text x="160" y="217" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#1f2d3d">- rulebook (role x op -&gt; tier)</text><text x="160" y="243" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#1f2d3d">- conduit allowlist</text><text x="160" y="269" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#1f2d3d">- identity bindings</text><text x="160" y="320" text-anchor="middle" font-family="Helvetica" font-size="10" font-weight="600" fill="#c9922b" font-style="italic">describes a site; the engine is unchanged</text><rect x="320" y="95" width="540" height="175" rx="15" fill="#eaf1f9" stroke="#2f6db0" stroke-width="2"/><text x="590.0" y="117" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#1f2d3d">Control plane: CARS decision engine</text><rect x="340" y="135" width="160" height="120" rx="7" fill="#ffffff" stroke="#2f6db0" stroke-width="1.6"/><text x="420.0" y="157" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#1f2d3d">Proactive policy</text><text x="420.0" y="178" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">identity binding</text><text x="420.0" y="193" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">conduit allowlist</text><text x="420.0" y="208" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">default-deny</text><rect x="512" y="135" width="180" height="120" rx="7" fill="#ffffff" stroke="#2f6db0" stroke-width="1.6"/><text x="602.0" y="157" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#1f2d3d">Reactive decision</text><text x="602.0" y="178" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">operation x role x</text><text x="602.0" y="193" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">criticality -&gt; tier</text><text x="602.0" y="208" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">-&gt; response ladder</text><rect x="704" y="135" width="140" height="120" rx="7" fill="#ffffff" stroke="#2f6db0" stroke-width="1.6"/><text x="774.0" y="157" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#1f2d3d">Self-check</text><text x="774.0" y="178" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">flow-integrity</text><text x="774.0" y="193" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">authenticated</text><text x="774.0" y="208" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">control API</text><line x1="270" y1="180" x2="320" y2="180" stroke="#c9922b" stroke-width="2.4" marker-end="url(#ah)"/><rect x="910" y="140" width="230" height="80" rx="9" fill="#f2ebf7" stroke="#8a4fb0" stroke-width="2"/><text x="1025.0" y="162" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#1f2d3d">DPI sensor</text><text x="1025.0" y="183" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">recovers the industrial operation</text><text x="1025.0" y="198" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">from mirrored traffic</text><line x1="910" y1="180" x2="860" y2="180" stroke="#8a4fb0" stroke-width="2.2" marker-end="url(#ah)"/><text x="885" y="170" text-anchor="middle" font-family="Helvetica" font-size="9.5" font-weight="600" fill="#8a4fb0">operation</text><rect x="320" y="370" width="540" height="120" rx="15" fill="#e8f5ee" stroke="#3a8f5b" stroke-width="2"/><text x="590.0" y="392" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#1f2d3d">Data plane: enforcement pipeline (on every switch)</text><rect x="340" y="410" width="152" height="64" rx="7" fill="#ffffff" stroke="#3a8f5b" stroke-width="1.6"/><text x="416" y="432" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#1f2d3d">Table 0</text><text x="416" y="448" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#1f2d3d">GUARD</text><text x="416" y="466" text-anchor="middle" font-family="Helvetica" font-size="10" font-weight="400" fill="#5b6b7d">identity</text><line x1="492" y1="442" x2="512" y2="442" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="512" y="410" width="152" height="64" rx="7" fill="#ffffff" stroke="#3a8f5b" stroke-width="1.6"/><text x="588" y="432" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#1f2d3d">Table 1</text><text x="588" y="448" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#1f2d3d">POLICY</text><text x="588" y="466" text-anchor="middle" font-family="Helvetica" font-size="10" font-weight="400" fill="#5b6b7d">stateful + reactive</text><line x1="664" y1="442" x2="684" y2="442" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="684" y="410" width="152" height="64" rx="7" fill="#ffffff" stroke="#3a8f5b" stroke-width="1.6"/><text x="760" y="432" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#1f2d3d">Table 2</text><text x="760" y="448" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#1f2d3d">SWITCH</text><text x="760" y="466" text-anchor="middle" font-family="Helvetica" font-size="10" font-weight="400" fill="#5b6b7d">forward</text><line x1="590" y1="270" x2="590" y2="370" stroke="#2f6db0" stroke-width="2.4" marker-end="url(#ah)"/><text x="600" y="325" text-anchor="start" font-family="Helvetica" font-size="10.5" font-weight="600" fill="#2f6db0" font-style="italic">installs flow rules (OpenFlow):  proactive 0x00a2,  reactive 0x00ca (criticality-scaled self-heal)</text><text x="300" y="442" text-anchor="end" font-family="Helvetica" font-size="11" font-weight="400" fill="#5b6b7d">traffic</text><line x1="302" y1="442" x2="340" y2="442" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><line x1="860" y1="442" x2="905" y2="442" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="905" y="415" width="150" height="54" rx="8" fill="#eef0f2" stroke="#6b7480" stroke-width="2"/><text x="980.0" y="437" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#1f2d3d">protected asset</text><text x="60" y="530" text-anchor="start" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#b23b3b">Principles:  decide is separate from enforce   ·   the decision (a tier) is separate from the response (an action)   ·   every response is bounded, reversible and evidence-generating</text></svg>