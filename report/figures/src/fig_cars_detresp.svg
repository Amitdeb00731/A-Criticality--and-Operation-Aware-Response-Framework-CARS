<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="Helvetica">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3a4a5c"/></marker></defs>
<rect width="1180" height="470" fill="white"/><text x="60" y="40" text-anchor="start" font-family="Helvetica" font-size="18" font-weight="700" fill="#1f2d3d">Detection to response, and self-heal</text><rect x="50" y="110" width="170" height="88" rx="9" fill="#fdeef0" stroke="#b23b3b" stroke-width="2"/><text x="135.0" y="132" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#1f2d3d">Attacker frame</text><text x="135.0" y="150" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">crosses the fabric,</text><text x="135.0" y="165" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">copied to the mirror</text><line x1="220" y1="154.0" x2="270" y2="154.0" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="270" y="110" width="180" height="88" rx="9" fill="#f2ebf7" stroke="#8a4fb0" stroke-width="2"/><text x="360.0" y="132" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#1f2d3d">Snort DPI</text><text x="360.0" y="150" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">recovers the operation,</text><text x="360.0" y="165" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">writes an alert</text><line x1="450" y1="154.0" x2="500" y2="154.0" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="500" y="110" width="180" height="88" rx="9" fill="#fbf1dc" stroke="#c9922b" stroke-width="2"/><text x="590.0" y="132" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#1f2d3d">Bridge</text><text x="590.0" y="150" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">tails the alert, posts</text><text x="590.0" y="165" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">to /cars/respond</text><line x1="680" y1="154.0" x2="730" y2="154.0" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="730" y="110" width="200" height="88" rx="9" fill="#eaf1f9" stroke="#2f6db0" stroke-width="2"/><text x="830.0" y="132" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#1f2d3d">Controller decides</text><text x="830.0" y="150" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">rulebook + criticality</text><text x="830.0" y="165" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">→ response  (~0.03 ms)</text><line x1="930" y1="154.0" x2="980" y2="154.0" stroke="#3a4a5c" stroke-width="2.2" marker-end="url(#ah)"/><rect x="980" y="110" width="150" height="88" rx="9" fill="#e8f5ee" stroke="#3a8f5b" stroke-width="2"/><text x="1055.0" y="132" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#1f2d3d">Switch enforces</text><text x="1055.0" y="150" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">installs 0x00ca rule,</text><text x="1055.0" y="165" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#1f2d3d">drops or meters</text><text x="590" y="94" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#5b6b7d" font-style="italic">wire to enforcement: median 7.6 ms</text><path d="M 1055 198 C 1055 320, 700 340, 640 340 C 560 340, 300 340, 250 198" fill="none" stroke="#2f8f8f" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="650" y="356" text-anchor="middle" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#2f8f8f" font-style="italic">hard_timeout expiry → the rule is removed and the source forgiven (self-heal, unless the attack renews it)</text><rect x="980" y="46" width="150" height="44" rx="9" fill="#eef2f6" stroke="#5b6b7d" stroke-width="2"/><text x="1055.0" y="68" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#1f2d3d">Flow-integrity check</text><line x1="1055" y1="90" x2="1055" y2="110" stroke="#5b6b7d" stroke-width="1.6" stroke-dasharray="4 3"/><text x="1055" y="40" text-anchor="middle" font-family="Helvetica" font-size="10" font-weight="400" fill="#1f2d3d"></text></svg>